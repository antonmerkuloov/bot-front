[build]
  command = "cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install"
  publish = "frontend/dist"

[functions]
  directory = "backend/netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ping"
  to = "/.netlify/functions/api/ping"
  status = 200
  force = true