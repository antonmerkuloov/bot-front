[build]
  # Сначала ставим зависимости в корне (для функций), потом собираем фронт
  command = "npm install && cd frontend && npm install --include=dev && npm run build"
  publish = "frontend/dist"

[functions]
  directory = "backend/netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ping"
  to = "/.netlify/functions/api/ping"
  status = 200
  force = true